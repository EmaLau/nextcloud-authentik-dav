version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Dev dependencies
    # Only development tools: the app itself has no Composer dependencies.
    ignore:
      - dependency-name: nextcloud/ocp   # pinned per Nextcloud version by the CI matrix
      # Must match what Nextcloud bundles (Guzzle 7) and run on PHP 8.1 (PHPUnit 10).
      - dependency-name: guzzlehttp/guzzle
        update-types: ["version-update:semver-major"]
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
