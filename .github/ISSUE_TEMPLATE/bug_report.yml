name: Bug report
description: A login fails when it should work (or works when it should not), or something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! English or Italian are both fine. **Never paste passwords or tokens.**
        Security problems go to the [private reporting](https://github.com/EmaLau/nextcloud-authentik-dav/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: App version
      description: "`occ app:list | grep authentik_dav`, e.g. 1.1.0"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Nextcloud and Authentik versions
      description: e.g. Nextcloud 35.0.3, Authentik 2026.8.5
    validations:
      required: true
  - type: dropdown
    id: flow
    attributes:
      label: How was the Authentik flow created?
      options:
        - With the blueprint in this repository
        - By hand
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The client and what it did, what you expected, what happened instead (401, 429, error page)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log line and connection test
      description: The `authentik_dav: login failed …` line from the Nextcloud log, and the result of "Test connection" on the settings page
      render: text
