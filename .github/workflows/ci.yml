name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every Monday: catches changes in Nextcloud master and in the latest Authentik without waiting for a push.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Nextcloud ${{ matrix.nextcloud }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest versions declared in appinfo/info.xml, plus one in between.
        # "36" is Nextcloud's master branch until 36 is released.
        include:
          - { nextcloud: '30', ocp: 'dev-stable30', php: '8.1' }
          - { nextcloud: '31', ocp: 'dev-stable31', php: '8.2' }
          - { nextcloud: '35', ocp: 'dev-stable35', php: '8.3' }
          - { nextcloud: '36', ocp: 'dev-master', php: '8.4' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Nextcloud ${{ matrix.nextcloud }} API)
        run: |
          composer require --dev --no-interaction --no-update nextcloud/ocp:${{ matrix.ocp }}
          composer update --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Tests
        run: composer test

      - name: Static analysis
        run: composer analyse

  appinfo:
    name: Validate appinfo/info.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate against the Nextcloud App Store schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o info.xsd
          xmllint --noout --schema info.xsd authentik_dav/appinfo/info.xml

  e2e:
    name: End to end (Authentik ${{ matrix.authentik }}, Nextcloud ${{ matrix.nextcloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { authentik: '2026.8.5', nextcloud: '35-apache' }
          - { authentik: '2026.8.5', nextcloud: '31-apache' }
    env:
      AUTHENTIK_TAG: ${{ matrix.authentik }}
      NEXTCLOUD_TAG: ${{ matrix.nextcloud }}
    steps:
      - uses: actions/checkout@v4

      - name: Random test secrets
        run: |
          for k in PG_PASS AUTHENTIK_SECRET_KEY AK_ADMIN_PASS AK_TOKEN NC_ADMIN_PASS TEST_USER_PASS; do
            echo "$k=$(openssl rand -hex 24)"
          done > dev/.env

      - name: Start Authentik and Nextcloud
        run: docker compose -f dev/compose.yaml --env-file dev/.env up -d --wait --wait-timeout 300

      - name: Wait for Nextcloud to finish installing
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8088/status.php | grep -q '"installed":true' && exit 0
            sleep 5
          done
          exit 1

      - name: Apply the blueprint, create test users, configure the app
        run: dev/setup.sh

      - name: End-to-end checks
        run: dev/test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f dev/compose.yaml --env-file dev/.env logs --tail 200
          docker compose -f dev/compose.yaml --env-file dev/.env exec -T -u www-data nextcloud php occ log:tail 50 || true

  e2e-latest:
    name: End to end (latest Authentik and Nextcloud)
    # Only on the weekly run and on demand: a new upstream release must not block pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AUTHENTIK_TAG: latest
      NEXTCLOUD_TAG: apache
    steps:
      - uses: actions/checkout@v4

      - name: Random test secrets
        run: |
          for k in PG_PASS AUTHENTIK_SECRET_KEY AK_ADMIN_PASS AK_TOKEN NC_ADMIN_PASS TEST_USER_PASS; do
            echo "$k=$(openssl rand -hex 24)"
          done > dev/.env

      - name: Start Authentik and Nextcloud
        run: docker compose -f dev/compose.yaml --env-file dev/.env up -d --wait --wait-timeout 300

      - name: Wait for Nextcloud to finish installing
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8088/status.php | grep -q '"installed":true' && exit 0
            sleep 5
          done
          exit 1

      - name: Versions
        run: |
          curl -fsS http://127.0.0.1:8088/status.php; echo
          docker compose -f dev/compose.yaml --env-file dev/.env exec -T authentik-server ak --version 2>/dev/null || true

      - name: Apply the blueprint, create test users, configure the app
        run: dev/setup.sh

      - name: End-to-end checks
        run: dev/test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f dev/compose.yaml --env-file dev/.env logs --tail 200
          docker compose -f dev/compose.yaml --env-file dev/.env exec -T -u www-data nextcloud php occ log:tail 50 || true
